---
name: "Build PullClient"

on:                          # yamllint disable-line rule:truthy
  schedule:
    - cron: '50 12 * * 6'

  workflow_dispatch:

  push:
    branches:
      - '**'
    tags:
      - '**'

env:
  TARGET: GitHubLightPullClient
  CHANNEL_BASE: GitHubLightPullClient


jobs:

  macOS:

    runs-on:
      - self-hosted
      - macOS

    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: macOS Build
        working-directory: ./Clients/Pull
        run: |
          go generate ./...
          $HOME/github/bin/build_go.sh

      - name: Mark Completed
        run: touch  ${{ runner.temp }}/Green

  linux:

    runs-on:
      - self-hosted
      - linux
      - X64

    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: linux Build
        working-directory: ./Clients/Pull
        run: |
          go generate ./...
          $HOME/github/bin/build_go.sh

      - name: Mark Completed
        run: touch  ${{ runner.temp }}/Green

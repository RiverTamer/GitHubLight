---
name: "Build LightServer"

on:                          # yamllint disable-line rule:truthy
  schedule:
    - cron: '18 12 * * 6'

  workflow_dispatch:

  push:
    branches:
      - '**'
    tags:
      - '**'

env:
  TARGET: GitHubLightServer
  CHANNEL_BASE: GitHubLightServer

jobs:

  macOS:

    runs-on:
      - self-hosted
      - macOS

    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: macOS Build
        working-directory: ./LightServer
        run: |
          go generate ./...
          $HOME/github/bin/build_go.sh

      - name: Mark Completed
        run: touch  ${{ runner.temp }}/Green


  linux:

    runs-on:
      - self-hosted
      - linux
      - X64

    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: linux Build
        working-directory: ./LightServer
        run: |
          go generate ./...
          $HOME/github/bin/build_go.sh

      - name: Mark Completed
        run: touch  ${{ runner.temp }}/Green
